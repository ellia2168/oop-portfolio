[package]
name = "fungus-em-core"
version = "0.1.0"
edition = "2021"
description = "High-performance FDTD & bio-electromagnetic synthesis simulation core for Radiomyces electrovorus"
authors = ["Antigravity & Lin Yunjia"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
